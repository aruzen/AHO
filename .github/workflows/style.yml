name: C++ style

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: style-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install tools and headers
        run: |
          brew install llvm@20 cmake ninja boost glfw glm googletest pkgconf vulkan-headers vulkan-loader spirv-cross shaderc
          echo "$(brew --prefix llvm@20)/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: |
          mkdir -p thirdparty
          curl --fail --location --retry 3 https://raw.githubusercontent.com/nothings/stb/003501f6d7a8668ce8b6d875e34dd97ad0d5d5b5/stb_image.h -o thirdparty/stb_image.h
          curl --fail --location --retry 3 https://raw.githubusercontent.com/nothings/stb/003501f6d7a8668ce8b6d875e34dd97ad0d5d5b5/stb_image_write.h -o thirdparty/stb_image_write.h
          cmake -S . -B build/style -G Ninja \
            -DAHO_HOME="$PWD/AHOLi/AHO" -DVSL_HOME="$PWD/VSLi/VSL" \
            -DBUILD_TESTING=ON -DAHO_STYLE_CHECKS=ON -DAHO_STYLE_JOBS=3 -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR="$(brew --prefix llvm@20)/lib/cmake/llvm" \
            -DClang_DIR="$(brew --prefix llvm@20)/lib/cmake/clang"
      - name: Build checker
        run: cmake --build build/style --target aho-style-ast --parallel 2
      - name: Verify checker contracts
        run: ctest --test-dir build/style -R '^Style\.' --output-on-failure
      - name: Check format, naming and layout
        run: cmake --build build/style --target check-style
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: style-report
          path: build/style-report
          if-no-files-found: ignore
