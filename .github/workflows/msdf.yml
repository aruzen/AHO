name: MSDF CPU resources

on:
  # プレリリース・正式リリースの公開時に検査する。
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: msdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install tools and dependencies
        run: brew install llvm@20 cmake ninja boost glfw glm googletest pkgconf vulkan-headers vulkan-loader spirv-cross spirv-tools shaderc freetype
      - name: Configure
        run: |
          mkdir -p thirdparty
          curl --fail --location --retry 3 https://raw.githubusercontent.com/nothings/stb/003501f6d7a8668ce8b6d875e34dd97ad0d5d5b5/stb_image.h -o thirdparty/stb_image.h
          curl --fail --location --retry 3 https://raw.githubusercontent.com/nothings/stb/003501f6d7a8668ce8b6d875e34dd97ad0d5d5b5/stb_image_write.h -o thirdparty/stb_image_write.h
          cmake -S . -B build/msdf -G Ninja \
            -DCMAKE_C_COMPILER="$(brew --prefix llvm@20)/bin/clang" \
            -DCMAKE_CXX_COMPILER="$(brew --prefix llvm@20)/bin/clang++" \
            -DAHO_HOME="$PWD/AHOLi/AHO" -DVSL_HOME="$PWD/VSLi/VSL" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DAHO_ENABLE_MSDF=ON -DAHO_BUILD_MSDF_EXAMPLE=ON \
            '-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer' \
            '-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer'
      - name: Build
        run: cmake --build build/msdf --target aho-msdf-test aho-msdf-example --parallel 3
      - name: Test without a GPU or window
        env:
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          ctest --test-dir build/msdf -R '^AHO[.]MSDF[.]' --output-on-failure
          ./build/msdf/AHOLi/aho-msdf-example AHOLi/AHO/test/fixtures/msdf/TestFont.ttf
